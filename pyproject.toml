[project]
name = "agent-dispatch-plugin"
version = "0.2.0"
description = "Inspection-only Hermes plugin over the Agent Dispatch public CLI."
requires-python = ">=3.11"
license = "MIT"
# Runtime is dependency-free. Development tools are pinned separately in
# requirements-dev.in and requirements-dev.txt, outside Hermes's workspace.
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# pytest 9 collects a root directory whose name is a valid Python
# identifier as a package and then never puts the repository root on
# sys.path, so the guarded modules' degenerate top-level imports
# (`import registry`) fail in any identifier-named clean clone. The
# hyphen-named working directory only passed by accident. Pin the root
# explicitly so every clone location imports identically.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
# The typed file list is derived in the Makefile (MYPY_SOURCES) so one
# hand-maintained source enumeration exists; the repository root is a
# hyphen-named Hermes plugin package, so the static view deliberately
# mirrors the degenerate top-level import path: the guarded runtime
# modules are checked as top-level modules.

[tool.uv]
# Source-only project: no wheel is built or distributed (PRD non-goal).
package = false
