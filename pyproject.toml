[project]
name = "agent-dispatch-plugin"
version = "0.1.0"
description = "Inspection-only Hermes plugin over the Agent Dispatch public CLI (skeleton)."
requires-python = ">=3.11"
license = "MIT"
# Runtime is dependency-free: the plugin reads only the frozen contract files
# shipped in this repository. jsonschema and PyYAML are dev toolchain only.
dependencies = []

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
]

[tool.uv]
# Source-only project: no wheel is built or distributed (PRD non-goal).
package = false
